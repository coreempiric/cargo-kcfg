[package]
name = "cargo-kcfg"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Cargo subcommand bringing Linux/Zephyr-style Kconfig support to Rust projects"
readme = "README.md"
documentation = "https://docs.rs/cargo-kcfg"
keywords = ["kconfig", "cargo", "embedded", "configuration"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[workspace]
members = ["macros"]
exclude = [
    "examples/minimal",
    "examples/depends",
    "examples/firmware",
    "examples/select",
    "examples/choice",
    "examples/errors",
    "examples/workspace",
]
resolver = "2"

[lib]
name = "cargo_kcfg"
path = "src/lib.rs"

[[bin]]
name = "cargo-kcfg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nom-kconfig = "0.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
