[package]
name = "cargo-kcfg"
version = "0.0.1"
edition = "2024"
authors = ["CoreEmpiric"]
license = "MIT"
description = "Cargo subcommand bringing Linux/Zephyr-style Kconfig support to Rust projects"
readme = "README.md"
homepage = "https://github.com/coreempiric/cargo-kcfg"
documentation = "https://docs.rs/cargo-kcfg"
keywords = ["kconfig", "cargo", "embedded", "configuration"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[workspace]
exclude = [
    "examples/minimal",
    "examples/depends",
    "examples/firmware",
    "examples/select",
    "examples/choice",
    "examples/errors",
    "examples/workspace",
]
resolver = "2"

[lib]
name = "cargo_kcfg"
path = "src/lib.rs"

[[bin]]
name = "cargo-kcfg"
path = "src/main.rs"
required-features = ["full"]

[features]
default = ["full"]
full = [
    "dep:clap",
    "dep:nom-kconfig",
    "dep:thiserror",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
nom-kconfig = { version = "0.13", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
tempfile = "3"
