[package]
name = "cargo-kconfig-macros"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Proc-macro include for cargo-kconfig generated CONFIG_* constants"
publish = false

[lib]
proc-macro = true

[dependencies]
cargo-kconfig = { path = "..", version = "0.0.1", default-features = false }
proc-macro2 = "1"
quote = "1"
